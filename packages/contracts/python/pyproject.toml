[project]
name = "crowdlens-contracts"
version = "0.1.0"
description = "CrowdLens contract mirror: canonical JSON + Pydantic models shared with the TS control plane"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crowdlens_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
