[project]
name = "crowdlens-worker"
version = "0.1.0"
description = "Shared worker runtime for CrowdLens data-plane services"
requires-python = ">=3.11"
dependencies = [
    "crowdlens-contracts",
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "httpx>=0.27",
    "numpy>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crowdlens_worker"]

[tool.uv.sources]
crowdlens-contracts = { path = "../../packages/contracts/python", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]
