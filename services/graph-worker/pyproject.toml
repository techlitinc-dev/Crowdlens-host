[project]
name = "crowdlens-graph-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "crowdlens-worker",
    "pypdf>=5.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["graph_worker"]

[tool.uv.sources]
crowdlens-worker = { path = "../common", editable = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 120
